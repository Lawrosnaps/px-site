# Static site. The "build" just copies the files into dist/, which is
# also what the Netlify UI expects, so either setting deploys the same thing.
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp -R index.html privacy.html cookies.html terms.html robots.txt sitemap.xml assets dist/"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep Netlify preview and branch deploys out of Google; only the live domain gets indexed.
[context.deploy-preview]
  command = "rm -rf dist && mkdir dist && cp -R index.html privacy.html cookies.html terms.html assets dist/ && printf 'User-agent: *\\nDisallow: /\\n' > dist/robots.txt"
[context.branch-deploy]
  command = "rm -rf dist && mkdir dist && cp -R index.html privacy.html cookies.html terms.html assets dist/ && printf 'User-agent: *\\nDisallow: /\\n' > dist/robots.txt"
