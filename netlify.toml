# Static site. The "build" just copies the files into dist/, which is
# also what the Netlify UI expects, so either setting deploys the same thing.
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp -R index.html privacy.html cookies.html terms.html assets dist/"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
